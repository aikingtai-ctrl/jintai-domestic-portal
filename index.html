<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金泰四大文化与视听资源库 · 国内直连总入口</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ed;color:#1f3136;font:19.5pt/1.62 "Microsoft YaHei","PingFang SC",sans-serif}
header,main,footer{max-width:1360px;margin:0 auto;padding:20px 26px}
header{padding-top:28px;padding-bottom:10px}
.badge-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.badge{background:#e3ece7;color:#1e463e;padding:5px 14px;border-radius:20px;font-size:15pt;font-weight:bold}
.badge.ok{background:#e6f4ea;color:#137333}
h1{font-size:29pt;line-height:1.3;margin:6px 0 10px;color:#162b30}
.lead{font-size:17pt;color:#42565b;margin:0 0 14px;background:#fff;border-left:5px solid #284b45;padding:12px 18px;border-radius:0 10px 10px 0;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border:1.5px solid #cfd9d2;border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.card h2{font-size:22.5pt;margin:0 0 8px;color:#183238;line-height:1.35}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:14pt;padding:3px 11px;border-radius:6px;background:#eef3f0;color:#284b45;font-weight:bold}
.tag.red{background:#faeaea;color:#8a1c1c}
.desc{font-size:16.5pt;color:#3d4f53;margin:6px 0 18px;line-height:1.58}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:9px;font:bold 16.5pt "Microsoft YaHei","PingFang SC",sans-serif;text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.primary{background:#284b45;color:#fff}
.btn.tunnel{background:#1b5e91;color:#fff}
.btn.ghost{background:#f5f8f6;color:#284b45;border-color:#8da399;font-weight:normal;font-size:15.5pt;padding:9px 15px}
.url-line{margin-top:12px;font-size:13.5pt;color:#607276;word-break:break-all;background:#f8faf8;padding:7px 11px;border-radius:6px;border:1px dashed #d6e0d9}
.toast{min-height:30px;font-size:16pt;color:#137333;font-weight:bold}
footer{font-size:15pt;color:#5d6e72;padding-bottom:40px}
@media(max-width:960px){
  .grid{grid-template-columns:1fr}
  header,main,footer{padding:16px}
  h1{font-size:24pt}
  .card h2{font-size:20.5pt}
}
</style>
</head>
<body>
<header>
  <div class="badge-bar">
    <span class="badge ok">● 中国大陆免代理直连</span>
    <span class="badge">微信内置浏览器兼容</span>
    <span class="badge">国内双 CDN + 边缘专线双保险</span>
  </div>
  <h1>金泰四大文化与视听资源库 · 国内直连总入口</h1>
  <p class="lead">已彻底解除 <code>chatgpt.site</code> 地域封锁，并将历史图库 404MB 全量分片压缩为 18MB 极速索引与微信页内验证。手机微信、Safari、Edge、Chrome 在国内网络均可直接打开。</p>
  <div class="toolbar">
    <button class="btn primary" id="copyAllBtn" type="button">一键复制全部 4 个国内直连网址（发微信直接点开）</button>
    <span class="toast" id="toastMsg"></span>
  </div>
</header>

<main>
  <div class="grid" id="cards"></div>
</main>

<footer>
  说明：《中国历史文化图库》保持原有内部访问口令保护（手机微信验证一次即自动记忆，不再弹系统输入框）；其余三座资源库均可直接免登录浏览、试听、检索与下载。
</footer>

<script>
(function(){
  var SITES = [
    {
      key: 'history',
      title: '1. 中国历史文化图库 · 总检索',
      tags: [['55,779 条目 / 280,412 提示词', ''], ['需访问口令 · 微信一次记住', 'red']],
      desc: '按历史纪年、50 政权、资产细目、考证等级与典籍故事科学检索。已升级 18MB 极速索引分片 + 国内双 CDN，解决手机闪退与口令弹窗拦截。',
      cloudUrl: 'https://aikingtai-ctrl.github.io/jintai-history-image-library/index.html',
      localPath: '/jintai-history-image-library/index.html'
    },
    {
      key: 'shengcang',
      title: '2. 声仓 · 找到画面之外的声音',
      tags: [['200 条影视声音素材', ''], ['34MB 原生音源直连试听/下载', '']],
      desc: '自然环境、生活器物、交通机械、动物生灵、界面动效等精选影视声效库。已完整脱离 chatgpt.site，支持国内在线试听、波形预览与原文件下载。',
      cloudUrl: 'https://aikingtai-ctrl.github.io/shengcang-sound-library/#sound-library',
      localPath: '/shengcang-sound-library/#sound-library'
    },
    {
      key: 'documentary',
      title: '3. 纪录片教学资源库 · 以真实，启发课堂',
      tags: [['678 部已发布课程档案 / 1,841 总目', ''], ['全字段离线秒搜', '']],
      desc: '覆盖 1910–2020 年代全球与中国经典纪录片，含教学切入点、课堂讨论问题、关联课程、片段分析与核查出处。已全量内嵌离线检索 API。',
      cloudUrl: 'https://aikingtai-ctrl.github.io/documentary-classroom-library/',
      localPath: '/documentary-classroom-library/'
    },
    {
      key: 'zhonghua',
      title: '4. 中华文明影像库 · 视觉美术参考',
      tags: [['全朝代馆藏文物实证', ''], ['默认直达：商代专卷', 'red']],
      desc: '汇集海内外博物馆开放馆藏与考古出土图像考证，涵盖史前、夏、商、西周、春秋战国、秦汉、魏晋、隋唐、宋辽金西夏等历代器物服饰与建筑实证。',
      cloudUrl: 'https://aikingtai-ctrl.github.io/zhonghua-civilization-atlas/?v=58#era=%E5%95%86',
      localPath: '/zhonghua-civilization-atlas/?v=58#era=%E5%95%86',
      extraBtn: { label: '打开全朝代首页', cloud: 'https://aikingtai-ctrl.github.io/zhonghua-civilization-atlas/', local: '/zhonghua-civilization-atlas/' }
    }
  ];

  var isLocalOrTunnel = /trycloudflare\.com$|127\.0\.0\.1$|localhost$/i.test(location.hostname || '');
  var activeTunnelBase = isLocalOrTunnel ? location.origin : '';

  function copyText(txt, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ showToast(msg); }).catch(function(){ fallbackCopy(txt, msg); });
    }else{
      fallbackCopy(txt, msg);
    }
  }
  function fallbackCopy(txt, msg){
    var ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    showToast(msg);
  }
  function showToast(m){
    var el = document.getElementById('toastMsg');
    el.textContent = m;
    setTimeout(function(){ if(el.textContent === m) el.textContent = ''; }, 4000);
  }

  function renderCards(){
    var box = document.getElementById('cards');
    box.innerHTML = '';
    SITES.forEach(function(s){
      var card = document.createElement('div');
      card.className = 'card';
      var tUrl = activeTunnelBase ? (activeTunnelBase + s.localPath) : '';
      var mainHref = isLocalOrTunnel ? tUrl : s.cloudUrl;
      var mainLabel = isLocalOrTunnel ? '立即打开（当前高速专线）' : '立即打开（永久云端直连）';

      var tagsHtml = s.tags.map(function(t){
        return '<span class="tag ' + (t[1]||'') + '">' + t[0] + '</span>';
      }).join('');

      var btnsHtml = '<a class="btn primary" href="' + mainHref + '" target="_blank" rel="noopener">' + mainLabel + '</a>';
      if(!isLocalOrTunnel && tUrl){
        btnsHtml += '<a class="btn tunnel" href="' + tUrl + '" target="_blank" rel="noopener">备用专线（零 github.io）</a>';
      } else if(isLocalOrTunnel){
        btnsHtml += '<a class="btn ghost" href="' + s.cloudUrl + '" target="_blank" rel="noopener">永久云端备份站</a>';
      }
      if(s.extraBtn){
        var exHref = isLocalOrTunnel ? (activeTunnelBase + s.extraBtn.local) : s.extraBtn.cloud;
        btnsHtml += '<a class="btn ghost" href="' + exHref + '" target="_blank" rel="noopener">' + s.extraBtn.label + '</a>';
      }
      btnsHtml += '<button class="btn ghost" type="button" data-copy="' + mainHref + '">复制网址</button>';

      card.innerHTML =
        '<div><h2>' + s.title + '</h2><div class="tags">' + tagsHtml + '</div><p class="desc">' + s.desc + '</p></div>' +
        '<div><div class="actions">' + btnsHtml + '</div><div class="url-line">' + mainHref + '</div></div>';
      box.appendChild(card);
    });

    box.querySelectorAll('button[data-copy]').forEach(function(b){
      b.onclick = function(){ copyText(b.getAttribute('data-copy'), '已复制网址，可直接粘贴到微信！'); };
    });
  }

  document.getElementById('copyAllBtn').onclick = function(){
    var lines = ['【金泰四大文化与视听资源库 · 国内直连地址】'];
    SITES.forEach(function(s){
      var u = (isLocalOrTunnel && activeTunnelBase) ? (activeTunnelBase + s.localPath) : s.cloudUrl;
      lines.push(s.title + '\n' + u);
      if(!isLocalOrTunnel && activeTunnelBase){
        lines.push('  ↳ 零github备用专线：' + activeTunnelBase + s.localPath);
      }
    });
    copyText(lines.join('\n\n'), '全部 4 个网址已复制！可直接发到手机微信点开。');
  };

  renderCards();

  if(!isLocalOrTunnel){
    fetch('./tunnel.json?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if(d && d.tunnel_url){
        activeTunnelBase = d.tunnel_url.replace(/\/$/, '');
        renderCards();
      }
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
